name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run repository security scan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/security_scan.sh
          ./scripts/security_scan.sh
